<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><title>Rodzicownik</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  #__demo { display: none !important; }
  html, body { margin: 0; height: 100%; background: #FBF7F0; overflow: hidden; }
  body { display: grid; place-items: center; font-family: Lato, sans-serif; color: #12352A;
    background-image: linear-gradient(#F3ECDF 1px, transparent 1px), linear-gradient(90deg, #F3ECDF 1px, transparent 1px);
    background-size: 28px 28px; }
  .wrap { text-align: center; transform: translateY(-14px); }
  .lock { display: inline-flex; align-items: center; gap: 22px; opacity: 0; transform: translateY(14px); animation: in .8s .15s cubic-bezier(.2,.8,.2,1) forwards; }
  .lock svg { width: 84px; height: 84px; }
  .lock span { font: 600 84px/1 Fraunces, Georgia, serif; letter-spacing: -0.012em; }
  .tag { margin-top: 22px; font: 700 26px/1.3 Lato, sans-serif; color: #5A616C; opacity: 0; animation: in .8s .45s ease forwards; }
  .tag mark { background: linear-gradient(transparent 58%, #FAB856 58%, #FAB856 92%, transparent 92%); color: #12352A; padding: 0 2px; }
  .team { margin-top: 56px; font: 700 19px/1.4 Lato, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #007834; opacity: 0; animation: in .8s 1.35s ease forwards; }
  .team i { font-style: normal; color: #5A616C; letter-spacing: .06em; text-transform: none; font-weight: 400; }
  @keyframes in { to { opacity: 1; transform: none; } }
</style></head>
<body><div class="wrap">
  <div class="lock">
    <svg viewBox="0 0 48 48"><rect width="48" height="48" rx="13" fill="#007834"/><path d="M16 36V12h9.5a7.5 7.5 0 0 1 0 15H16" fill="none" stroke="#FBF7F0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 27l9 9" stroke="#FBF7F0" stroke-width="5" stroke-linecap="round"/><circle cx="24.5" cy="19.5" r="3.2" fill="#FAB856"/></svg>
    <span>Rodzicownik</span>
  </div>
  <div class="tag">Urlopy i zasiłki z ZUS, <mark>policzone</mark> dla Ciebie.</div>
  <div class="team">ZUS × HackNation 2026 &nbsp;·&nbsp; KN Solvro<br><i>Tomasz Trela · Dominika Stefaniak</i></div>
</div>
</body></html>
